<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Space-Travel Landing Page</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Tech stack (pinned, CDN-only) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"Times New Roman"', 'Times', 'serif'],
                        body: ['"Roboto"', 'sans-serif'],
                    },
                    borderRadius: {
                        DEFAULT: "9999px",
                    }
                }
            }
        }
    </script>

    <!-- Liquid-glass utilities -->
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .liquid-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.45) 0%,
                    rgba(255, 255, 255, 0.15) 20%,
                    rgba(255, 255, 255, 0) 40%,
                    rgba(255, 255, 255, 0) 60%,
                    rgba(255, 255, 255, 0.15) 80%,
                    rgba(255, 255, 255, 0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .liquid-glass-strong {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: none;
            box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .liquid-glass-strong::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.5) 0%,
                    rgba(255, 255, 255, 0.2) 20%,
                    rgba(255, 255, 255, 0) 40%,
                    rgba(255, 255, 255, 0) 60%,
                    rgba(255, 255, 255, 0.2) 80%,
                    rgba(255, 255, 255, 0.5) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useRef, useState } = React;
        // Fallback to window.FramerMotion just in case
        const { motion, useInView, AnimatePresence } = window.Motion || window.FramerMotion || window;

        function FadingVideo({ src, className, style }) {
            const videoRef = useRef(null);
            const fadingOutRef = useRef(false);
            const fadeRafRef = useRef(null);

            const FADE_MS = 500;
            const FADE_OUT_LEAD = 0.55;

            const fadeTo = (targetOpacity, duration = FADE_MS) => {
                if (!videoRef.current) return;
                const startOpacity = parseFloat(videoRef.current.style.opacity) || 0;
                const startTime = performance.now();

                if (fadeRafRef.current) {
                    cancelAnimationFrame(fadeRafRef.current);
                }

                const animate = (time) => {
                    if (!videoRef.current) return;
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    const currentOpacity = startOpacity + (targetOpacity - startOpacity) * progress;
                    videoRef.current.style.opacity = currentOpacity;

                    if (progress < 1) {
                        fadeRafRef.current = requestAnimationFrame(animate);
                    }
                };
                fadeRafRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const handleLoadedData = () => {
                    video.style.opacity = 0;
                    video.play().catch(e => console.error(e));
                    fadeTo(1);
                };

                const handleTimeUpdate = () => {
                    if (fadingOutRef.current) return;
                    const remaining = video.duration - video.currentTime;
                    if (remaining <= FADE_OUT_LEAD && remaining > 0) {
                        fadingOutRef.current = true;
                        fadeTo(0);
                    }
                };

                const handleEnded = () => {
                    video.style.opacity = 0;
                    setTimeout(() => {
                        if (!videoRef.current) return;
                        videoRef.current.currentTime = 0;
                        videoRef.current.play().catch(e => console.error(e));
                        fadingOutRef.current = false;
                        fadeTo(1);
                    }, 100);
                };

                video.addEventListener('loadeddata', handleLoadedData);
                video.addEventListener('timeupdate', handleTimeUpdate);
                video.addEventListener('ended', handleEnded);

                return () => {
                    if (fadeRafRef.current) cancelAnimationFrame(fadeRafRef.current);
                    video.removeEventListener('loadeddata', handleLoadedData);
                    video.removeEventListener('timeupdate', handleTimeUpdate);
                    video.removeEventListener('ended', handleEnded);
                };
            }, []);

            return (
                <video
                    ref={videoRef}
                    src={src}
                    className={className}
                    style={{ ...style, opacity: 0 }}
                    muted
                    playsInline
                    preload="auto"
                />
            );
        };

        function BlurText({ text, className }) {
            const words = text.split(" ");
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, amount: 0.1 });

            return (
                <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
                    {words.map((word, i) => (
                        <motion.span
                            key={i}
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                            animate={isInView ? {
                                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                                opacity: [0, 0.5, 1],
                                y: [50, -5, 0]
                            } : {}}
                            transition={{
                                duration: 0.7,
                                times: [0, 0.5, 1],
                                ease: "easeOut",
                                delay: (i * 100) / 1000
                            }}
                            style={{ display: "inline-block", marginRight: "0.28em" }}
                        >
                            {word}
                        </motion.span>
                    ))}
                </p>
            );
        };

        function HeroSection({ onOpen }) {
            return (
                <section className="relative w-full h-screen bg-black overflow-hidden flex flex-col">
                    <FadingVideo
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4"
                        className="absolute left-1/2 top-0 -translate-x-1/2 object-cover object-top z-0"
                        style={{ width: "120%", height: "120%" }}
                    />

                    <div className="z-10 relative flex flex-col h-full">


                        {/* Hero content */}
                        <div className="flex-1 flex flex-col items-center justify-center pt-24 px-4 text-center">


                            <BlurText
                                text="A little invitation for you"
                                className="text-6xl md:text-7xl lg:text-[5.5rem] font-heading italic text-white leading-[0.8] w-full max-w-none whitespace-nowrap justify-center tracking-[-4px]"
                            />

                            <motion.p
                                initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                                animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                                transition={{ ease: "easeOut", duration: 0.8, delay: 0.8 }}
                                className="mt-4 text-sm md:text-base text-white max-w-2xl font-body font-light leading-tight"
                            >
                                I've been thinking about this for a while... Would you like to go on a first date with me?
                            </motion.p>

                            <motion.div
                                initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                                animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                                transition={{ ease: "easeOut", duration: 0.8, delay: 1.1 }}
                                className="flex items-center gap-6 mt-6"
                            >
                                <button onClick={onOpen} className="liquid-glass-strong rounded-full px-5 py-2.5 text-sm font-medium text-white flex items-center gap-1 hover:bg-white/10 transition-colors">
                                    Open
                                    <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="M7 17L17 7" />
                                        <path d="M7 7h10v10" />
                                    </svg>
                                </button>
                            </motion.div>


                        </div>


                    </div>
                </section>
            );
        };

        function CapabilitiesSection() {
            const cards = [
                { title: "1. WannaTe", location: "Cầu Giấy", time: "19h 06/09/2026", link: "https://vt.tiktok.com/ZSq1FnUdy/" },
                { title: "2. Đi ăn đêmmm, recommend ăn ốc" },
                { title: "3. NoxJoy", location: "Cầu Giấy", time: "23h", link: "https://www.tiktok.com/@noxjoystation/video/7630846257652616469?_r=1&_t=ZS-99OvXI5LdHo" }
            ];

            return (
                <section className="relative w-full min-h-screen bg-black overflow-hidden flex flex-col">
                    <FadingVideo
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
                        className="absolute inset-0 w-full h-full object-cover z-0"
                    />

                    <div className="relative z-10 px-8 md:px-16 lg:px-20 pt-24 pb-10 flex flex-col min-h-screen">
                        <div className="mb-auto">

                            <h2 className="font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]">
                                Kế hoạch của anh !!!
                            </h2>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
                            {cards.map((card, idx) => (
                                <div 
                                    key={idx} 
                                    className={`liquid-glass rounded-[1.25rem] p-8 min-h-[280px] flex flex-col justify-between items-center text-center ${card.link ? 'cursor-pointer hover:scale-[1.02] transition-transform' : ''}`}
                                    onClick={() => card.link && window.open(card.link, '_blank')}
                                >
                                    <h3 className="font-heading italic text-white text-3xl md:text-4xl tracking-[-1px] leading-tight my-auto">
                                        {card.title}
                                    </h3>
                                    {(card.location || card.time) && (
                                        <div className="flex flex-col gap-2 w-full mt-6">
                                            {card.location && (
                                                <div className="liquid-glass rounded-full px-4 py-2 text-sm text-white/90 font-body w-full flex items-center justify-center">
                                                    {card.location}
                                                </div>
                                            )}
                                            {card.time && (
                                                <div className="liquid-glass rounded-full px-4 py-2 text-sm text-white/90 font-body w-full flex items-center justify-center">
                                                    {card.time}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>


                    </div>
                </section>
            );
        };

        // Suppress React dev warnings about list keys per instructions
        const originalError = console.error;
        console.error = (...args) => {
            if (typeof args[0] === 'string' && args[0].includes('Each child in a list should have a unique "key" prop')) return;
            originalError.call(console, ...args);
        };

        function App() {
            const [showCapabilities, setShowCapabilities] = useState(false);

            useEffect(() => {
                if (showCapabilities) {
                    window.scrollTo(0, 0);
                }
            }, [showCapabilities]);

            return (
                <main className="relative bg-black min-h-screen">
                    <AnimatePresence mode="wait">
                        {!showCapabilities ? (
                            <motion.div
                                key="hero"
                                initial={{ opacity: 1 }}
                                exit={{ opacity: 0 }}
                                transition={{ duration: 0.8 }}
                            >
                                <HeroSection onOpen={() => setShowCapabilities(true)} />
                            </motion.div>
                        ) : (
                            <motion.div
                                key="capabilities"
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ duration: 0.8 }}
                            >
                                <CapabilitiesSection />
                            </motion.div>
                        )}
                    </AnimatePresence>
                </main>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
